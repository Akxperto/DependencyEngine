services:
  dependencyEngine:
    container_name: dependencyEngine
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"   # Flask API — web dashboard
      - "5001:5001"   # MCP SSE server — proxy endpoint for Odysseus
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=5001
      - WORKFLOW_API_URL=http://localhost:5000/api
    volumes:
      - ./workflow.json:/app/workflow.json
    restart: unless-stopped
    networks:
      - odysseus_net

networks:
  odysseus_net:
    external: true
